[workspace]
resolver = "2"
members = [
    "crates/wgmesh-core",
    "crates/wgmesh-wglink",
    "crates/wgmesh-coord",
    "crates/wgmesh-agent",
    "crates/wgmesh-tools",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.75"

[workspace.dependencies]
wgmesh-core = { path = "crates/wgmesh-core" }

# core + serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hex = "0.4"
thiserror = "1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }

# crypto
ed25519-dalek = "2"
x25519-dalek = "2"
sha2 = "0.10"
rand = "0.8"
ssh-key = { version = "0.6", features = ["ed25519"] }

# logging / cli
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }

# server (coord)
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "fs", "time", "signal"] }
axum = { version = "0.7", default-features = false, features = ["http1", "tokio", "json", "matched-path"] }

# client (agent + smoketest)
ureq = "2"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
